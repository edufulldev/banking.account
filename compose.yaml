
services:

  # ==========================================================
  # DATABASE - POSTGRESQL
  # ==========================================================
  postgres-account:
    image: postgres:16
    container_name: banking-account-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: banking_account
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}

    ports:
      - "5435:5432"

    volumes:
      - account_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking_account"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # OBSERVABILITY - PROMETHEUS
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: banking-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================================
  # OBSERVABILITY - GRAFANA
  # ==========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: banking-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Defina GRAFANA_PASSWORD no ambiente}

    volumes:
      - grafana_data:/var/lib/grafana

# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================
volumes:
  account_data:
  prometheus_data:
  grafana_data:
