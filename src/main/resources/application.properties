
# ==========================================================
# APPLICATION
# ==========================================================
spring.application.name=account-service

# ==========================================================
# SERVER
# ==========================================================
server.port=8081

# ==========================================================
# DATABASE - POSTGRESQL
# ==========================================================
spring.datasource.url=jdbc:postgresql://localhost:5435/banking_account
spring.datasource.username=${DB_USERNAME:banking}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / HIBERNATE
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
# SECURITY - JWT
# ==========================================================
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=60

# ==========================================================
# SPRING BOOT ACTUATOR
# ==========================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ==========================================================
# RESILIENCE4J - CIRCUIT BREAKER
# ==========================================================

# Registrar indicador de saude
resilience4j.circuitbreaker.instances.externalBank.registerHealthIndicator=true

# Quantidade de chamadas analisadas
resilience4j.circuitbreaker.instances.externalBank.slidingWindowSize=5

# Minimo de chamadas para calcular a taxa de falhas
resilience4j.circuitbreaker.instances.externalBank.minimumNumberOfCalls=5

# Abrir circuito quando 50% das chamadas falharem
resilience4j.circuitbreaker.instances.externalBank.failureRateThreshold=50

# Tempo de espera antes de testar a recuperacao
resilience4j.circuitbreaker.instances.externalBank.waitDurationInOpenState=30s

# Chamadas permitidas no estado HALF_OPEN
resilience4j.circuitbreaker.instances.externalBank.permittedNumberOfCallsInHalfOpenState=2


# ==========================================================
# APACHE KAFKA
# ==========================================================

# Endereco do broker Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer - Serializacao das mensagens
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer - Desserializacao das mensagens
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Identificacao do grupo de consumidores
spring.kafka.consumer.group-id=banking-account-group

# Consumir mensagens desde o inicio quando nao houver offset salvo
spring.kafka.consumer.auto-offset-reset=earliest

# ==========================================================
# LOGGING - HIBERNATE
# ==========================================================

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO


management.endpoint.health.probes.enabled=true

