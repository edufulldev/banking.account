
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres-account

spec:
  serviceName: postgres-account
  replicas: 1

  selector:
    matchLabels:
      app: postgres-account

  template:
    metadata:
      labels:
        app: postgres-account

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: banking_account

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: account-service-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-service-secret
                  key: SPRING_DATASOURCE_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi
